<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Galleria</title>

<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="theme-color" content="#faf7f2" />

<meta name="description" content="__OG_DESCRIPTION__" />
<meta property="og:type" content="website" />
<meta property="og:title" content="__OG_TITLE__" />
<meta property="og:description" content="__OG_DESCRIPTION__" />
<meta property="og:image" content="__OG_IMAGE__" />
<meta property="og:url" content="__OG_URL__" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="__OG_TITLE__" />
<meta name="twitter:description" content="__OG_DESCRIPTION__" />
<meta name="twitter:image" content="__OG_IMAGE__" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<header class="topbar">
  <h1 id="galleryTitle">Galleria</h1>
  <div class="topbar-actions">
    <button id="menuToggle" class="icon-btn menu-toggle" type="button" aria-expanded="false" aria-controls="filtersPanel">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
      <span>Filtri</span>
    </button>
    <button id="moreToggle" class="icon-btn menu-toggle" type="button" aria-expanded="false" aria-controls="morePanel">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 8a2 2 0 100-4 2 2 0 000 4zM12 14a2 2 0 100-4 2 2 0 000 4zM12 20a2 2 0 100-4 2 2 0 000 4z"/></svg>
      <span>Altro</span>
    </button>
  </div>
</header>

<div id="filtersPanel" class="filters-panel" hidden>
  <label class="filter-row">
    <span class="filter-label">Filtra per invitato</span>
    <select id="authorFilter" aria-label="Filtra per autore">
      <option value="">Tutti gli invitati</option>
    </select>
  </label>
  <label class="filter-row">
    <span class="filter-label">Ordina per</span>
    <select id="sortSelect" aria-label="Ordina">
      <option value="desc">Più recenti</option>
      <option value="asc">Meno recenti</option>
      <option value="likes">Più apprezzate</option>
    </select>
  </label>
</div>

<div id="morePanel" class="filters-panel" hidden>
  <a href="https://forza4.anninoefederica.com" class="filter-row more-link">
    <span>Sfida un invitato 🎲</span>
  </a>
</div>

<div id="filtersOverlay" class="filters-overlay" hidden></div>

<div id="hero" class="hero" hidden>
  <img id="heroImg" alt="" />
  <div class="hero-overlay">
    <h2 id="heroTitle"></h2>
  </div>
</div>

<main id="grid" class="grid" aria-live="polite"></main>

<p id="emptyState" class="empty-state" hidden>Nessuna foto ancora. Sii il primo a caricarne una! 📸</p>

<label id="uploadFab" class="fab" for="fileInput" title="Carica foto">
  <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
  <input id="fileInput" type="file" accept="image/*,.heic,.heif" multiple hidden />
</label>

<div id="uploadProgress" class="upload-progress" hidden>
  <div class="upload-progress-bar"><div id="uploadProgressFill"></div></div>
  <span id="uploadProgressText">Caricamento…</span>
</div>

<!-- Modale nome invitato -->
<div id="nameModal" class="modal-overlay" hidden>
  <div class="modal">
    <h2>Benvenuto! 💍</h2>
    <p>Come ti chiami? Il tuo nome verrà mostrato accanto alle foto che carichi.</p>
    <form id="nameForm">
      <input id="nameInput" type="text" maxlength="60" placeholder="Es. Mario Rossi" required autofocus />
      <button type="submit">Continua</button>
    </form>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Chiudi">✕</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Precedente">‹</button>
  <img id="lightboxImg" src="" alt="" />
  <div id="heartPop" class="heart-pop" hidden>
    <svg viewBox="0 0 24 24" width="90" height="90"><path fill="#fff" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
  </div>
  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Successiva">›</button>
  <div class="lightbox-caption">
    <span id="lightboxAuthor"></span>
    <span id="lightboxDate"></span>
    <button id="lightboxLike" type="button" class="like-btn" title="Metti/togli like">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <span id="lightboxLikeCount">0</span>
    </button>
    <a id="lightboxDownload" download title="Scarica">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M5 20h14v-2H5v2zM12 4v10.17l3.59-3.58L17 12l-5 5-5-5 1.41-1.41L12 14.17V4z"/></svg>
      <span>Scarica</span>
    </a>
    <button id="lightboxDelete" type="button" title="Elimina questa foto" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
    </button>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
